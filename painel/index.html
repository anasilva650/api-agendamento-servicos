<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel de Agendamento e Serviços</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">
  <header class="bg-indigo-700 text-white shadow">
    <div class="max-w-6xl mx-auto px-4 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <div>
        <h1 class="text-xl font-bold">Painel de Agendamento e Serviços</h1>
        <p class="text-indigo-200 text-sm">Front-end integrado à API FastAPI + SQLAlchemy</p>
      </div>
      <div class="flex items-center gap-2 text-xs bg-indigo-800 px-3 py-1.5 rounded-full w-fit">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-amber-400"></span>
        <span id="status-text">Verificando API...</span>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-3 gap-8">
    <!-- Formulário de Novo Agendamento -->
    <section class="bg-white p-6 rounded-xl shadow-sm border border-slate-200 h-fit">
      <h2 class="text-lg font-semibold mb-4 text-slate-800">Novo Agendamento</h2>

      <div id="alerta" class="hidden mb-4 p-3 rounded-lg text-sm font-medium"></div>

      <form id="form-agendamento" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Cliente</label>
          <select id="cliente_id" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Carregando clientes...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Profissional</label>
          <select id="profissional_id" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Carregando profissionais...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Serviço</label>
          <select id="servico_id" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
            <option value="">Carregando serviços...</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Data e Hora de Início</label>
          <input type="datetime-local" id="data_hora_inicio" required
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Observações (opcional)</label>
          <textarea id="observacoes" rows="2" maxlength="300" placeholder="Detalhes do atendimento..."
            class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
        </div>

        <button type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 px-4 rounded-lg text-sm transition">
          Agendar Horário
        </button>
      </form>
    </section>

    <!-- Lista de Agendamentos -->
    <section class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-slate-200">
      <div class="flex items-center justify-between mb-4">
        <h2 class="text-lg font-semibold text-slate-800">Agendamentos Registrados</h2>
        <button id="btn-atualizar"
          class="text-sm text-indigo-600 hover:text-indigo-800 font-medium">
          Atualizar dados
        </button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse text-sm">
          <thead>
            <tr class="border-b border-slate-200 text-slate-500">
              <th class="py-2.5 pr-3">ID / Cliente</th>
              <th class="py-2.5 px-3">Profissional / Serviço</th>
              <th class="py-2.5 px-3">Início → Fim</th>
              <th class="py-2.5 px-3">Status</th>
              <th class="py-2.5 pl-3 text-right">Ações</th>
            </tr>
          </thead>
          <tbody id="tabela-agendamentos" class="divide-y divide-slate-100">
            <tr>
              <td colspan="5" class="py-6 text-center text-slate-400">Carregando agendamentos...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
